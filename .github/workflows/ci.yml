name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - stable

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run verify

      - name: Verify optional window starter
        run: python3 -m unittest discover -s extensions/window-start -p "test_*.py"
